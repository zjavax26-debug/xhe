name: Evaluate ISOBMFF muxer
on:
  push:
    branches:
      - experiment/isobmff-muxer
    paths:
      - ".github/workflows/isobmff-muxer-eval.yml"
      - "docs/isobmff-muxer-evaluation.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-isobmff:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout app repository
        uses: actions/checkout@v4

      - name: Checkout pinned MPEGGroup reference library
        run: |
          git clone --filter=blob:none https://github.com/MPEGGroup/isobmff.git /tmp/isobmff
          git -C /tmp/isobmff checkout 689ac096a8e485385089341785c10271cf0684a8

      - name: Configure library-only build
        run: |
          cmake -S /tmp/isobmff -B /tmp/isobmff-build \
            -DISOBMFF_BUILD_LIB_ONLY=ON \
            -DGIT_SUBMODULE=OFF \
            -DLIBISOMEDIAFILE_STRICT_WARNINGS=OFF \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build libisomediafile
        run: cmake --build /tmp/isobmff-build --target libisomediafile --parallel 2


      - name: Install Android NDK
        uses: android-actions/setup-android@v3

      - name: Install pinned Android NDK
        run: sdkmanager "ndk;27.2.12479018"


      - name: Add Android POSIX platform shim configuration
        run: |
          cat > /tmp/isomediafile-android-platform.cmake <<'EOF'
          if(TARGET libisomediafile)
            target_include_directories(libisomediafile PRIVATE "${CMAKE_CURRENT_LIST_DIR}/IsoLib/libisomediafile/linux")
            target_sources(libisomediafile PRIVATE "${CMAKE_CURRENT_LIST_DIR}/IsoLib/libisomediafile/linux/SimpleFileMappingObject.c")
            target_compile_definitions(libisomediafile PRIVATE LINUX)
          endif()
          EOF

      - name: Configure Android ARM64 library build
        run: |
          cmake -S /tmp/isobmff -B /tmp/isobmff-android-arm64 \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/27.2.12479018/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DISOBMFF_BUILD_LIB_ONLY=ON \
            -DLIBISOMEDIAFILE_STRICT_WARNINGS=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          # Upstream CMake currently selects platform glue only for Linux,
          # Windows and macOS. Android uses the Linux/POSIX file-mapping shim.
          cmake -S /tmp/isobmff -B /tmp/isobmff-android-arm64 \
            -DCMAKE_PROJECT_INCLUDE=/tmp/isomediafile-android-platform.cmake

      - name: Build Android ARM64 libisomediafile
        run: |
          cmake --build /tmp/isobmff-android-arm64 --target libisomediafile --parallel 2
          find /tmp/isobmff-android-arm64 -type f -name 'liblibisomediafile.a' -print -quit | grep -q .

      - name: Verify required muxing API symbols
        shell: bash
        run: |
          set -euo pipefail
          LIB="$(find /tmp/isobmff-build -type f -name 'liblibisomediafile.a' -print -quit)"
          test -n "$LIB"
          nm -g "$LIB" | grep -q ' MP4NewMovie$'
          nm -g "$LIB" | grep -q ' MP4NewSampleDescription$'
          nm -g "$LIB" | grep -q ' MP4AddMediaSamples$'
          nm -g "$LIB" | grep -q ' MP4WriteMovieToFile$'
          echo "libisomediafile built and required muxing APIs are present: $LIB"
