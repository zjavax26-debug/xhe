name: Evaluate ISOBMFF muxer
on:
  push:
    branches:
      - experiment/isobmff-muxer
    paths:
      - ".github/workflows/isobmff-muxer-eval.yml"
      - "docs/isobmff-muxer-evaluation.md"
      - "tools/isobmff_poc/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-isobmff:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout app repository
        uses: actions/checkout@v4

      - name: Checkout pinned MPEGGroup reference library
        run: |
          git clone --filter=blob:none https://github.com/MPEGGroup/isobmff.git /tmp/isobmff
          git -C /tmp/isobmff checkout 689ac096a8e485385089341785c10271cf0684a8

      - name: Configure library-only build
        run: |
          cmake -S /tmp/isobmff -B /tmp/isobmff-build \
            -DISOBMFF_BUILD_LIB_ONLY=ON \
            -DGIT_SUBMODULE=OFF \
            -DLIBISOMEDIAFILE_STRICT_WARNINGS=OFF \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build libisomediafile
        run: cmake --build /tmp/isobmff-build --target libisomediafile --parallel 2


      - name: Install pinned Android NDK
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          # sdkmanager closes stdin after accepting all licenses; with pipefail,
          # yes may report SIGPIPE even though license acceptance succeeded.
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" --install "ndk;27.2.12479018"
          test -d "$ANDROID_HOME/ndk/27.2.12479018"


      - name: Enable upstream POSIX shim for Android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("/tmp/isobmff/IsoLib/libisomediafile/CMakeLists.txt")
          s = p.read_text()
          marker = "target_include_directories("
          patch = """if(ANDROID)
              target_sources(libisomediafile PRIVATE ${CMAKE_CURRENT_LIST_DIR}/linux/SimpleFileMappingObject.c)
              target_include_directories(libisomediafile PRIVATE ${CMAKE_CURRENT_LIST_DIR}/linux)
              target_compile_definitions(libisomediafile PRIVATE LINUX)
          endif()

          """
          if marker not in s:
              raise SystemExit("Could not locate target_include_directories in upstream CMake")
          p.write_text(s.replace(marker, patch + marker, 1))
          PY

      - name: Configure Android ARM64 library build
        run: |
          cmake -S /tmp/isobmff -B /tmp/isobmff-android-arm64 \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/27.2.12479018/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DISOBMFF_BUILD_LIB_ONLY=ON \
            -DLIBISOMEDIAFILE_STRICT_WARNINGS=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON

      - name: Build Android ARM64 libisomediafile
        run: |
          cmake --build /tmp/isobmff-android-arm64 --target libisomediafile --parallel 2
          find /tmp/isobmff-android-arm64 -type f -name 'liblibisomediafile.a' -print -quit | grep -q .

      - name: Checkout pinned libxaac encoder
        uses: actions/checkout@v4
        with:
          repository: ittiam-systems/libxaac
          ref: 2fbadd57bca46693b7a077bcf1513131106d960c
          path: third_party/libxaac

      - name: Build libxaac host encoder
        run: |
          cmake -S third_party/libxaac -B /tmp/libxaac-build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/libxaac-build --target xaacenc xaacdec --parallel 2
          find /tmp/libxaac-build -type f -name xaacdec -perm -111 -print -quit | grep -q .

      - name: Generate PCM and encode genuine USAC AOT 42
        run: |
          python3 - <<'PY'
          import math, struct, wave
          rate = 48000
          with wave.open("/tmp/usac-input.wav", "wb") as w:
              w.setnchannels(2); w.setsampwidth(2); w.setframerate(rate)
              pcm = bytearray()
              for i in range(rate):
                  v = int(9000 * math.sin(2 * math.pi * 440 * i / rate))
                  pcm += struct.pack("<hh", v, v)
              w.writeframes(pcm)
          PY
          ENCODER="$(find /tmp/libxaac-build -type f -name xaacenc -perm -111 -print -quit)"
          test -n "$ENCODER"
          "$ENCODER" -ifile:/tmp/usac-input.wav -ofile:/tmp/usac-output.usac -br:64000 -aot:42
          test -s /tmp/usac-output.usac
          test -s /tmp/usac-output.txt

      - name: Decode genuine USAC elementary stream with libxaac decoder
        run: |
          DECODER="$(find /tmp/libxaac-build -type f -name xaacdec -perm -111 -print -quit)"
          test -n "$DECODER"
          "$DECODER" -ifile:/tmp/usac-output.usac -imeta:/tmp/usac-output.txt -ofile:/tmp/usac-decoded.wav -mp4:1
          python3 - <<'PY'
          import wave, pathlib
          p = pathlib.Path("/tmp/usac-decoded.wav")
          assert p.is_file() and p.stat().st_size > 44, "decoder produced no PCM WAV"
          with wave.open(str(p), "rb") as w:
              channels, rate, frames, width = w.getnchannels(), w.getframerate(), w.getnframes(), w.getsampwidth()
          print(f"USAC decode passed: channels={channels}, rate={rate}, frames={frames}, sample_width={width}, duration={frames/rate:.6f}s")
          assert channels == 2 and rate > 0 and frames > 0 and width in (2, 3, 4)
          PY

      - name: Measure USAC encoder delay and padding across input durations
        run: |
          python3 - <<'PY'
          import math, struct, wave, subprocess, pathlib, re
          enc=next(pathlib.Path("/tmp/libxaac-build").rglob("xaacenc"))
          dec=next(pathlib.Path("/tmp/libxaac-build").rglob("xaacdec"))
          for seconds in (0.25,0.5,1.0,1.5,2.0):
              stem=f"/tmp/timing-{str(seconds).replace('.','_')}"
              wav=stem+".wav"; usac=stem+".usac"; meta=stem+".txt"; out=stem+"-decoded.wav"
              rate=48000; frames=round(rate*seconds)
              with wave.open(wav,"wb") as w:
                  w.setnchannels(2); w.setsampwidth(2); w.setframerate(rate)
                  pcm=bytearray()
                  for i in range(frames):
                      v=int(9000*math.sin(2*math.pi*440*i/rate))
                      pcm+=struct.pack("<hh",v,v)
                  w.writeframes(pcm)
              subprocess.run([str(enc),f"-ifile:{wav}",f"-ofile:{usac}","-br:64000","-aot:42"],check=True,stdout=subprocess.DEVNULL)
              subprocess.run([str(dec),f"-ifile:{usac}",f"-imeta:{meta}",f"-ofile:{out}","-mp4:1"],check=True,stdout=subprocess.DEVNULL)
              m=pathlib.Path(meta).read_text()
              def val(k):
                  x=re.search(r"^-"+re.escape(k)+r":(\d+)$",m,re.M)
                  return int(x.group(1)) if x else None
              sizes=re.findall(r"^-ia_mp4_stsz_size:(\d+)$",m,re.M)
              with wave.open(out,"rb") as w:
                  decoded=w.getnframes(); decoded_rate=w.getframerate()
              coded_units=len(sizes)
              print(f"TIMING input={frames} ({seconds:.2f}s) AU={coded_units} media_scale={val('media_time_scale')} play_samples={val('playTimeInSamples')} start_offset={val('startOffsetInSamples')} decoded={decoded}/{decoded_rate} ({decoded/decoded_rate:.6f}s) raw_bytes={pathlib.Path(usac).stat().st_size}")
          PY

      - name: Install Python signal-analysis dependency
        run: python3 -m pip install --user numpy

      - name: Measure decoded USAC signal alignment and end padding
        run: |
          python3 - <<'PY'
          import math, struct, wave, subprocess, pathlib
          import numpy as np
          enc=next(pathlib.Path("/tmp/libxaac-build").rglob("xaacenc"))
          dec=next(pathlib.Path("/tmp/libxaac-build").rglob("xaacdec"))
          rate=48000
          for seconds in (0.25,0.5,1.0,1.5,2.0):
              stem=f"/tmp/alignment-{str(seconds).replace('.','_')}"
              wav,usac,meta,out=stem+".wav",stem+".usac",stem+".txt",stem+"-decoded.wav"
              frames=round(rate*seconds)
              # A deterministic multi-tone signal avoids the ambiguous phase/periodicity of a single sine.
              src=np.array([int(7000*math.sin(2*math.pi*431*i/rate)+1800*math.sin(2*math.pi*997*i/rate)+900*math.sin(2*math.pi*2137*i/rate)) for i in range(frames)],dtype=np.float64)
              with wave.open(wav,"wb") as w:
                  w.setnchannels(2);w.setsampwidth(2);w.setframerate(rate)
                  pcm=np.column_stack((src,src)).astype("<i2").tobytes();w.writeframes(pcm)
              subprocess.run([str(enc),f"-ifile:{wav}",f"-ofile:{usac}","-br:64000","-aot:42"],check=True,stdout=subprocess.DEVNULL)
              subprocess.run([str(dec),f"-ifile:{usac}",f"-imeta:{meta}",f"-ofile:{out}","-mp4:1"],check=True,stdout=subprocess.DEVNULL)
              with wave.open(out,"rb") as w:
                  decoded=np.frombuffer(w.readframes(w.getnframes()),dtype="<i2").reshape(-1,w.getnchannels())[:,0].astype(np.float64)
                  out_rate=w.getframerate()
              assert out_rate==rate and len(decoded)>0,(out_rate,len(decoded))
              # Diagnostic only: search both polarities and report short/long decoded output without asserting an assumed delay.
              max_lag=min(8192,max(0,len(decoded)-1024))
              best=(0.0,0,1.0)
              for lag in range(max_lag+1, max_lag+1) if False else range(max_lag+1):
                  n=min(len(src),len(decoded)-lag)
                  if n<1024: continue
                  a=src[:n];b=decoded[lag:lag+n]
                  den=np.linalg.norm(a)*np.linalg.norm(b)
                  score=float(np.dot(a,b)/den) if den else 0.0
                  if abs(score)>abs(best[0]):best=(score,lag,1.0 if score>=0 else -1.0)
              score,lag,polarity=best
              trailing=max(0,len(decoded)-lag-len(src))
              print(f"ALIGN input={seconds:.2f}s source_frames={frames} decoded_frames={len(decoded)} start_offset_candidate={lag} end_padding_candidate={trailing} signed_correlation={score:.6f} polarity={polarity:+.0f} status=diagnostic")
          PY

      - name: Inspect USAC encoder metadata and decoded PCM frame accounting
        run: |
          python3 - <<'PY'
          import math, struct, wave, subprocess, pathlib, re
          enc=next(pathlib.Path("/tmp/libxaac-build").rglob("xaacenc"))
          dec=next(pathlib.Path("/tmp/libxaac-build").rglob("xaacdec"))
          rate=48000
          for seconds in (0.25,0.5,1.0,1.5,2.0):
              stem=f"/tmp/accounting-{str(seconds).replace('.','_')}"
              wav,usac,meta,out=stem+".wav",stem+".usac",stem+".txt",stem+"-decoded.wav"
              frames=round(rate*seconds)
              with wave.open(wav,"wb") as w:
                  w.setnchannels(2);w.setsampwidth(2);w.setframerate(rate)
                  pcm=bytearray()
                  for i in range(frames):
                      v=int(7000*math.sin(2*math.pi*431*i/rate)+1800*math.sin(2*math.pi*997*i/rate)+900*math.sin(2*math.pi*2137*i/rate))
                      pcm+=struct.pack("<hh",v,v)
                  w.writeframes(pcm)
              subprocess.run([str(enc),f"-ifile:{wav}",f"-ofile:{usac}","-br:64000","-aot:42"],check=True,stdout=subprocess.DEVNULL)
              subprocess.run([str(dec),f"-ifile:{usac}",f"-imeta:{meta}",f"-ofile:{out}","-mp4:1"],check=True,stdout=subprocess.DEVNULL)
              txt=pathlib.Path(meta).read_text()
              def val(k):
                  m=re.search(r"^-"+re.escape(k)+r":(\d+)$",txt,re.M)
                  return int(m.group(1)) if m else None
              sizes=[int(x) for x in re.findall(r"^-ia_mp4_stsz_size:(\d+)$",txt,re.M)]
              with wave.open(out,"rb") as w:
                  dec_frames=w.getnframes(); dec_rate=w.getframerate(); channels=w.getnchannels()
              raw_size=pathlib.Path(usac).stat().st_size
              init=val("dec_info_init")
              print(f"ACCOUNT input={frames} input_s={seconds:.6f} init_bytes={init} AUs_meta={val('ia_mp4_stsz_entries')} AUs_list={len(sizes)} AU_bytes={sum(sizes)} raw_bytes={raw_size} media_scale={val('media_time_scale')} play_samples={val('playTimeInSamples')} start_offset_meta={val('startOffsetInSamples')} decoded_frames={dec_frames} decoded_rate={dec_rate} channels={channels} decoded_s={dec_frames/dec_rate:.6f} decoded_superframes={dec_frames/2048:.3f}")
              assert init is not None and len(sizes)==val("ia_mp4_stsz_entries") and init+sum(sizes)==raw_size
          PY

      - name: Validate libxaac initialization bytes and access-unit table
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          raw = Path("/tmp/usac-output.usac").read_bytes()
          meta = Path("/tmp/usac-output.txt").read_text()
          def one(name):
              m = re.search(r"^-" + re.escape(name) + r":(\d+)$", meta, re.M)
              assert m, "missing metadata field: " + name
              return int(m.group(1))
          init = one("dec_info_init")
          count = one("ia_mp4_stsz_entries")
          sizes = [int(x) for x in re.findall(r"^-ia_mp4_stsz_size:(\d+)$", meta, re.M)]
          rate = one("media_time_scale")
          duration = one("playTimeInSamples")
          print(f"Encoder metadata: init={init}, entries={count}, listed_sizes={len(sizes)}, rate={rate}, play_samples={duration}, raw_bytes={len(raw)}")
          assert init > 0 and count > 0 and len(sizes) == count
          assert all(n > 0 for n in sizes)
          assert init + sum(sizes) == len(raw), (init, sum(sizes), len(raw))
          assert rate > 0 and duration > 0
          print(f"USAC AOT 42 stream validated: init={init} bytes, access_units={count}, payload={sum(sizes)} bytes, play_time={duration} samples at {rate} Hz")
          PY

      - name: Upload genuine USAC stream and encoder metadata
        uses: actions/upload-artifact@v4
        with:
          name: genuine-usac-aot42-test
          path: |
            /tmp/usac-output.usac
            /tmp/usac-output.txt

      - name: Build structural MP4 muxer proof of concept
        run: |
          mkdir -p /tmp/isobmff-poc
          cat > /tmp/isobmff-poc/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.16)
          project(isobmff_poc C)
          add_subdirectory(/tmp/isobmff /tmp/isobmff-poc/upstream)
          add_executable(mux_one_sample "${POC_SOURCE}")
          target_include_directories(mux_one_sample PRIVATE /tmp/isobmff/IsoLib/libisomediafile/src)
          target_link_libraries(mux_one_sample PRIVATE libisomediafile)
          EOF
          cmake -S /tmp/isobmff-poc -B /tmp/isobmff-poc/build -DCMAKE_BUILD_TYPE=Release -DPOC_SOURCE="$GITHUB_WORKSPACE/tools/isobmff_poc/mux_one_sample.c"
          cmake --build /tmp/isobmff-poc/build --target mux_one_sample --parallel 2

      - name: Mux genuine USAC stream and inspect MP4 sample payload
        run: |
          /tmp/isobmff-poc/build/mux_one_sample /tmp/usac-output.usac /tmp/usac-output.txt /tmp/isobmff-poc/genuine-usac.m4a 64000 1024 reserved
          python3 - <<'PY'
          import pathlib, struct, re
          raw = pathlib.Path("/tmp/usac-output.usac").read_bytes()
          meta = pathlib.Path("/tmp/usac-output.txt").read_text()
          def one(name):
              m = re.search(r"^-" + re.escape(name) + r":(\d+)$", meta, re.M)
              assert m, "missing " + name
              return int(m.group(1))
          init = one("dec_info_init")
          count = one("ia_mp4_stsz_entries")
          sizes = [int(x) for x in re.findall(r"^-ia_mp4_stsz_size:(\d+)$", meta, re.M)]
          asc = raw[:init]
          payload = raw[init:]
          mp4 = pathlib.Path("/tmp/isobmff-poc/genuine-usac.m4a").read_bytes()
          boxes = []
          off = 0
          while off + 8 <= len(mp4):
              size = struct.unpack(">I", mp4[off:off+4])[0]
              kind = mp4[off+4:off+8].decode("latin1")
              header = 8
              if size == 1:
                  size = struct.unpack(">Q", mp4[off+8:off+16])[0]; header = 16
              elif size == 0:
                  size = len(mp4) - off
              assert size >= header and off + size <= len(mp4), (kind, size, off)
              boxes.append((kind, off, size, header))
              off += size
          assert off == len(mp4), "trailing MP4 bytes"
          kinds = [x[0] for x in boxes]
          assert all(k in kinds for k in ("ftyp", "moov", "mdat")), kinds
          mdat = next(x for x in boxes if x[0] == "mdat")
          media_payload = mp4[mdat[1]+mdat[3]:mdat[1]+mdat[2]]
          assert media_payload == payload, "MP4 mdat does not preserve all real USAC access-unit bytes in order"
          moov = next(x for x in boxes if x[0] == "moov")
          moov_data = mp4[moov[1]:moov[1]+moov[2]]
          assert b"mp4a" in moov_data, "missing mp4a audio sample entry"
          assert b"esds" in moov_data, "missing MPEG-4 ES descriptor"
          assert asc in moov_data, "encoder AudioSpecificConfig not found in sample description"
          assert len(sizes) == count and sum(sizes) == len(payload)
          print(f"Real USAC M4A structure passed: boxes={kinds}, access_units={count}, mdat_payload={len(media_payload)} bytes, ASC={len(asc)} bytes")
          print("NOTE: byte-preservation and box structure are verified; independent USAC decode and exact per-AU timing remain separate gates.")
          PY

      - name: Probe M4A with FFmpeg demuxer and decoder
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffprobe -v error -show_entries format=format_name,duration -show_entries stream=codec_name,codec_tag_string,sample_rate,channels,duration,time_base -of default=noprint_wrappers=1 /tmp/isobmff-poc/genuine-usac.m4a | tee /tmp/ffprobe-usac.txt
          set +e
          ffmpeg -v warning -i /tmp/isobmff-poc/genuine-usac.m4a -f null - 2>/tmp/ffmpeg-usac-decode.log
          status=$?
          set -e
          echo "FFmpeg decode exit status: $status"
          cat /tmp/ffmpeg-usac-decode.log
          if [ "$status" -eq 0 ]; then echo "FFmpeg accepted and decoded the M4A stream"; else echo "FFmpeg could not decode this USAC M4A; inspect diagnostics (not treated as a muxer pass)"; fi

      - name: Dump USAC ASC and MPEG-4 descriptor diagnostics
        run: |
          python3 - <<'PY'
          import pathlib, struct, re
          raw=pathlib.Path("/tmp/usac-output.usac").read_bytes()
          meta=pathlib.Path("/tmp/usac-output.txt").read_text()
          m=re.search(r"^-dec_info_init:(\d+)$",meta,re.M); assert m
          n=int(m.group(1)); asc=raw[:n]
          print("USAC init bytes:",asc.hex(" "))
          print("USAC init length:",len(asc))
          print("Expected AOT marker bits (first 5 bits):",(asc[0]>>3)&31)
          p=pathlib.Path("/tmp/isobmff-poc/genuine-usac.m4a")
          b=p.read_bytes()
          def boxes(start,end):
              out=[]; off=start
              while off+8<=end:
                  size,typ=struct.unpack_from(">I4s",b,off); h=8
                  if size==1:size=struct.unpack_from(">Q",b,off+8)[0];h=16
                  elif size==0:size=end-off
                  assert size>=h and off+size<=end
                  out.append((typ.decode("latin1"),off,size,h));off+=size
              assert off==end
              return out
          def walk(parent,depth=0):
              typ,off,size,h=parent
              if typ in ("moov","trak","mdia","minf","stbl","edts","udta","mvex"):
                  for child in boxes(off+h,off+size): walk(child,depth+1)
              elif typ in ("mp4a","esds"):
                  print("BOX",typ,"offset",off,"size",size,"hex",b[off:off+size].hex(" "))
          for x in boxes(0,len(b)): walk(x)
          PY
          echo "--- ffprobe stream and format diagnostics ---"
          ffprobe -v debug -show_streams -show_format /tmp/isobmff-poc/genuine-usac.m4a 2>&1 | tail -n 100

      - name: Rebuild USAC elementary stream from M4A sample tables and decode it
        run: |
          python3 - <<'PY'
          import pathlib, struct, re
          p = pathlib.Path("/tmp/isobmff-poc/genuine-usac.m4a")
          b = p.read_bytes()
          def boxes(start, end):
              out=[]; off=start
              while off+8 <= end:
                  n, typ = struct.unpack_from(">I4s", b, off); h=8
                  if n==1: n=struct.unpack_from(">Q",b,off+8)[0]; h=16
                  elif n==0: n=end-off
                  assert n>=h and off+n<=end, (typ,n,off,end)
                  out.append((typ.decode("latin1"),off,n,h))
                  off+=n
              assert off==end,(off,end)
              return out
          def child(parent, typ, payload_start=None):
              _,off,n,h=parent
              start=off+h if payload_start is None else payload_start
              return next(x for x in boxes(start,off+n) if x[0]==typ)
          top=boxes(0,len(b))
          moov=next(x for x in top if x[0]=="moov")
          trak=child(moov,"trak")
          mdia=child(trak,"mdia"); minf=child(mdia,"minf"); stbl=child(minf,"stbl")
          stbl_children=boxes(stbl[1]+stbl[3],stbl[1]+stbl[2])
          def get(t): return next(x for x in stbl_children if x[0]==t)
          stsz=get("stsz"); q=stsz[1]+stsz[3]+4
          fixed,count=struct.unpack_from(">II",b,q)
          q+=8
          if fixed: sizes=[fixed]*count
          else: sizes=list(struct.unpack_from(">"+("I"*count),b,q))
          stco=get("stco"); q=stco[1]+stco[3]+4
          nchunks=struct.unpack_from(">I",b,q)[0]; q+=4
          offsets=list(struct.unpack_from(">"+("I"*nchunks),b,q))
          stsc=get("stsc"); q=stsc[1]+stsc[3]+4
          n=struct.unpack_from(">I",b,q)[0]; q+=4
          entries=[struct.unpack_from(">III",b,q+12*i) for i in range(n)]
          assert len(offsets)==1 and entries[0][1]==count, (len(offsets),entries,count)
          mdat=next(x for x in top if x[0]=="mdat")
          data=b"".join(b[offsets[0]+sum(sizes[:i]):offsets[0]+sum(sizes[:i+1])] for i in range(count))
          assert offsets[0]>=mdat[1]+mdat[3] and offsets[0]+sum(sizes)<=mdat[1]+mdat[2]
          raw=pathlib.Path("/tmp/usac-output.usac").read_bytes()
          meta=pathlib.Path("/tmp/usac-output.txt").read_text()
          def one(k):
              m=re.search(r"^-"+re.escape(k)+r":(\d+)$",meta,re.M); assert m,k
              return int(m.group(1))
          init=one("dec_info_init")
          original_sizes=[int(x) for x in re.findall(r"^-ia_mp4_stsz_size:(\d+)$",meta,re.M)]
          assert sizes==original_sizes, "M4A stsz sample sizes differ from encoder access-unit table"
          assert data==raw[init:], "M4A chunk/sample mapping did not reproduce encoded USAC payload"
          rebuilt=pathlib.Path("/tmp/usac-from-m4a.usac")
          rebuilt.write_bytes(raw[:init]+data)
