name: Android debug APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app
        uses: actions/checkout@v4

      - name: Checkout pinned libxaac source
        uses: actions/checkout@v4
        with:
          repository: ittiam-systems/libxaac
          ref: 2fbadd57bca46693b7a077bcf1513131106d960c
          path: third_party/libxaac

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK, NDK and CMake
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 cmake;3.22.1 ndk;27.0.12077973'

      - name: Verify pinned libxaac checkout
        run: |
          test -f third_party/libxaac/encoder/libxaacenc.cmake
          test -f third_party/libxaac/encoder/ixheaace_api.h
          echo "Pinned libxaac source tree is present"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK with native libxaac
        run: gradle :app:assembleDebug

      - name: Verify xHE encoder is packaged in APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          unzip -l "$APK" | grep 'lib/arm64-v8a/libxhe_jni.so'
          unzip -p "$APK" lib/arm64-v8a/libxhe_jni.so > /tmp/libxhe_jni.so
          NDK_DIR="$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort | tail -n 1)"
          "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm" -D --defined-only /tmp/libxhe_jni.so | grep 'ixheaace_get_lib_id_strings'
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xhe-audio-converter-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
