plugins {
    id 'com.android.application'
}

android {
    namespace 'com.xhe.audioconverter'
    compileSdk 35

    defaultConfig {
        applicationId 'com.xhe.audioconverter'
        minSdk 29
        targetSdk 35
        versionCode 4
        versionName '0.4.0'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                arguments "-DLIBXAAC_SOURCE_DIR=${projectDir}/../third_party/libxaac",
                        "-DEXHALE_SOURCE_DIR=${projectDir}/../third_party/exhale"
                cppFlags ''
                cFlags '-O3'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
